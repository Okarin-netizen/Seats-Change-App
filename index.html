<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>席替えアンケート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>席替えアンケート</h1>
  <a class="entry-card" href="teacher.html">
    <span class="entry-label">先生はこちら</span>
    <span class="entry-title">教員用ページを開く</span>
    <span class="entry-text">座席の配置を決めて、生徒にリンクを配り、集まった希望をまとめます。かぶった席のくじ、座席表の印刷、発表モードもここから使えます。</span>
  </a>
  <section class="card entry-student">
    <h2>生徒のみなさんへ</h2>
    <p>先生から届いた<strong>リンク</strong>を開いて、希望の席を選んでください。このページからは開かないでください（先生が決めた座席の配置が入りません）。</p>
    <p class="muted">先生向け：<a href="student.html">生徒用ページを試しに開く</a>（6列 × 6人の見本で表示されます）</p>
  </section>
</main>
</body>
</html>
