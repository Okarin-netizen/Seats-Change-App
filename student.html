<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>席替えアンケート（生徒用）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>席替えアンケート <span class="round-label" id="roundLabel"></span></h1>

  <section class="card">
    <h2>1. あなたの情報</h2>
    <div class="form-row">
      <label>出席番号
        <input type="number" id="number" min="1" max="99" required>
      </label>
      <label>名前
        <input type="text" id="name" placeholder="例：山田 太郎" maxlength="50" required>
      </label>
    </div>
  </section>

  <section class="card">
    <h2>2. 希望の座席を選ぶ</h2>
    <p class="muted"><span id="howTo">座りたい席を1つクリックしてください。別の席をクリックすると選び直せます。</span><span id="takenNote"></span></p>
    <p class="message" id="limitNote" hidden></p>
    <div class="form-row mb" id="rankSwitch" hidden>
      <span>いま選んでいるのは：</span>
      <label class="check"><input type="radio" name="rank" value="1" checked> 第1希望</label>
      <label class="check"><input type="radio" name="rank" value="2"> 第2希望</label>
    </div>
    <p class="legend" id="hotLegend" hidden><span class="badge hot-badge">人気</span>前回、希望がかぶった席です。ほかの席も考えてみてください。</p>
    <div class="front">教卓（前）</div>
    <div class="grid-wrap">
      <div class="seat-grid" id="grid"></div>
    </div>
    <p class="choice" id="choice"></p>
  </section>

  <section class="card">
    <h2>3. 提出する</h2>
    <p class="muted" id="submitNote">「提出ファイルを保存」を押すと JSON ファイルがダウンロードされます。そのファイルを先生の指示どおりに提出してください。</p>
    <button type="button" class="primary" id="submit">提出ファイルを保存</button>
    <button type="button" id="download" hidden>提出ファイルを保存する</button>
    <div class="message" id="message"></div>
  </section>

  <details class="card">
    <summary>座席の配置について（先生向け）</summary>
    <p class="muted">座席の配置は、教員用ページの「座席の配置」で作った生徒用リンクから開くと反映されます。リンクなしで開いたときは 6列 × 6人 です。</p>
  </details>
</main>

<script src="common.js"></script>
<script>
(() => {
  const layout = SeatApp.layoutFromUrl() || SeatApp.makeLayout();
  const { round, taken, hot, second, prev, maxRow, number: presetNumber, api } = SeatApp.surveyFromUrl();
  const { rows, cols } = layout;
  const submitBtn = document.getElementById("submit");
  const downloadBtn = document.getElementById("download");
  const grid = document.getElementById("grid");
  const choiceEl = document.getElementById("choice");
  const messageEl = document.getElementById("message");
  const numberInput = document.getElementById("number");
  let choice = null;  // 第1希望 {row, col}
  let choice2 = null; // 第2希望 {row, col}（second=1 のときだけ）

  if (api) {
    submitBtn.textContent = "提出する";
    document.getElementById("submitNote").textContent =
      "「提出する」を押すと先生に届きます。出し直したいときは、選び直してもう一度押してください（最後に出したものが使われます）。";
  }

  document.getElementById("roundLabel").textContent = `（第${round}回）`;
  if (taken.size) {
    document.getElementById("takenNote").textContent = "灰色の「決定済」の席は、前回までに決まった席なので選べません。";
  }
  if (presetNumber) numberInput.value = presetNumber;
  if (maxRow) {
    const note = document.getElementById("limitNote");
    note.hidden = false;
    note.textContent = `あなたは前から${maxRow}列目までの席から選んでください。`;
  }
  if (second) {
    document.getElementById("rankSwitch").hidden = false;
    document.getElementById("howTo").textContent =
      "第1希望と第2希望を1つずつクリックしてください。第1希望がほかの人とかぶったときは、空いていれば第2希望の席になります。第2希望は選ばなくても提出できます。";
  }
  document.getElementById("hotLegend").hidden = hot.size === 0;

  function showMessage(text, type) {
    SeatApp.showMessage(messageEl, text, type);
  }

  const currentRank = () => second && document.querySelector('input[name="rank"]:checked').value === "2" ? 2 : 1;
  const same = (a, r, c) => a && a.row === r && a.col === c;

  // 入力中の出席番号の、前回の席（先生が「前回と同じ席を選べなくする」にしたときだけ届く）
  function prevKey() {
    const n = Number(numberInput.value);
    return prev.get(n) || "";
  }

  // 選べない理由。選べるときは ""
  function blockReason(r, c) {
    if (taken.has(SeatApp.key(r, c))) return "決定済";
    if (maxRow && r > maxRow) return "選べない";
    if (prevKey() === SeatApp.key(r, c)) return "前回の席";
    return "";
  }

  function render() {
    // 出席番号を変えて選べなくなった席は外す
    if (choice && blockReason(choice.row, choice.col)) choice = null;
    if (choice2 && blockReason(choice2.row, choice2.col)) choice2 = null;

    grid.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    grid.innerHTML = "";
    for (let r = 1; r <= rows; r++) {
      for (let c = 1; c <= cols; c++) {
        if (!SeatApp.isSeat(layout, r, c)) {
          const gap = document.createElement("div");
          gap.className = "seat aisle";
          grid.appendChild(gap);
          continue;
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seat";
        btn.title = SeatApp.seatLabel(layout, r, c);
        const pos = `<span class="pos">${SeatApp.seatShortLabel(layout, r, c)}</span>`;
        const blocked = blockReason(r, c);
        if (blocked) {
          btn.classList.add("taken");
          btn.disabled = true;
          btn.innerHTML = `<span class="rank">${blocked}</span>${pos}`;
        } else if (same(choice, r, c)) {
          btn.classList.add("rank1");
          btn.innerHTML = `<span class="rank">${second ? "第1希望" : "希望"}</span>${pos}`;
        } else if (same(choice2, r, c)) {
          btn.classList.add("rank2");
          btn.innerHTML = `<span class="rank">第2希望</span>${pos}`;
        } else {
          if (hot.has(SeatApp.key(r, c))) btn.classList.add("hot");
          btn.innerHTML = (hot.has(SeatApp.key(r, c)) ? '<span class="hot-mark">人気</span>' : "") + pos;
        }
        btn.addEventListener("click", () => {
          const seat = { row: r, col: c };
          if (currentRank() === 2) {
            if (same(choice, r, c)) choice = null;
            choice2 = seat;
          } else {
            if (same(choice2, r, c)) choice2 = null;
            choice = seat;
            // 第1希望を選んだら、続けて第2希望を選べるように切り替える
            if (second && !choice2) document.querySelector('input[name="rank"][value="2"]').checked = true;
          }
          showMessage("");
          render();
        });
        grid.appendChild(btn);
      }
    }
    const text = s => s ? SeatApp.seatLabel(layout, s.row, s.col) : '<span class="muted">未選択</span>';
    choiceEl.innerHTML = `<span class="badge r1">${second ? "第1希望" : "希望"}</span>${text(choice)}` +
      (second ? `<br><span class="badge r2">第2希望</span>${text(choice2)}` : "");
  }

  function buildData() {
    const number = Number(numberInput.value);
    const name = document.getElementById("name").value.trim();
    if (!Number.isInteger(number) || number < 1) {
      showMessage("出席番号を入力してください。", "error");
      return null;
    }
    if (!name) {
      showMessage("名前を入力してください。", "error");
      return null;
    }
    if (!choice) {
      showMessage(second ? "第1希望の席を選んでください。" : "希望の席を1つ選んでください。", "error");
      return null;
    }

    const data = {
      app: SeatApp.APP_ID,
      version: SeatApp.VERSION,
      round,
      number,
      name,
      rows,
      cols,
      off: [...layout.off],
      choice: { row: choice.row, col: choice.col },
      submittedAt: new Date().toISOString(),
    };
    if (second && choice2) data.choice2 = { row: choice2.row, col: choice2.col };
    return data;
  }

  function download(data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    // 日本語のファイル名は環境によって無視されるため、回と出席番号だけにする
    const filename = `seat_r${round}_${String(data.number).padStart(2, "0")}.json`;
    SeatApp.downloadBlob(blob, filename);
    showMessage(`「${filename}」を保存しました。このファイルを先生に提出してください。`, "ok");
  }

  submitBtn.addEventListener("click", async () => {
    const data = buildData();
    if (!data) return;
    if (!api) {
      download(data);
      return;
    }
    submitBtn.disabled = true;
    downloadBtn.hidden = true;
    showMessage("送信中です…");
    try {
      await SeatApp.postToApi(api, data);
      showMessage(`提出しました（${SeatApp.seatLabel(layout, data.choice.row, data.choice.col)}` +
        (data.choice2 ? `、第2希望 ${SeatApp.seatLabel(layout, data.choice2.row, data.choice2.col)}` : "") + "）。", "ok");
    } catch (e) {
      showMessage("送信できませんでした。少し待ってからもう一度押すか、下のボタンでファイルを保存して先生に渡してください。", "error");
      downloadBtn.hidden = false;
    } finally {
      submitBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener("click", () => {
    const data = buildData();
    if (data) download(data);
  });

  numberInput.addEventListener("input", () => { if (prev.size) render(); });

  render();
})();
</script>
</body>
</html>
