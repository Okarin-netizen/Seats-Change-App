<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>席替えアンケート（生徒用）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>席替えアンケート <span class="round-label" id="roundLabel"></span></h1>

  <section class="card">
    <h2>1. あなたの情報</h2>
    <div class="form-row">
      <label>出席番号
        <input type="number" id="number" min="1" max="99" required>
      </label>
      <label>名前
        <input type="text" id="name" placeholder="例：山田 太郎" required>
      </label>
    </div>
  </section>

  <section class="card">
    <h2>2. 希望の座席を選ぶ</h2>
    <p class="muted">座りたい席を1つクリックしてください。別の席をクリックすると選び直せます。<span id="takenNote"></span></p>
    <div class="front">教卓（前）</div>
    <div class="grid-wrap">
      <div class="seat-grid" id="grid"></div>
    </div>
    <p class="choice" id="choice"></p>
  </section>

  <section class="card">
    <h2>3. 提出する</h2>
    <p class="muted" id="submitNote">「提出ファイルを保存」を押すと JSON ファイルがダウンロードされます。そのファイルを先生の指示どおりに提出してください。</p>
    <button type="button" class="primary" id="submit">提出ファイルを保存</button>
    <button type="button" id="download" hidden>提出ファイルを保存する</button>
    <div class="message" id="message"></div>
  </section>

  <details class="card">
    <summary>座席の配置について（先生向け）</summary>
    <p class="muted">座席の配置は、教員用ページの「座席の配置」で作った生徒用リンクから開くと反映されます。リンクなしで開いたときは 6列 × 6人 です。</p>
  </details>
</main>

<script src="common.js"></script>
<script>
(() => {
  const layout = SeatApp.layoutFromUrl() || SeatApp.makeLayout();
  const { round, taken, api } = SeatApp.surveyFromUrl();
  const submitBtn = document.getElementById("submit");
  const downloadBtn = document.getElementById("download");
  if (api) {
    submitBtn.textContent = "提出する";
    document.getElementById("submitNote").textContent =
      "「提出する」を押すと先生に届きます。出し直したいときは、選び直してもう一度押してください（最後に出したものが使われます）。";
  }
  const { rows, cols } = layout;
  const grid = document.getElementById("grid");
  const choiceEl = document.getElementById("choice");
  const messageEl = document.getElementById("message");
  let choice = null; // {row, col}

  document.getElementById("roundLabel").textContent = `（第${round}回）`;
  if (taken.size) {
    document.getElementById("takenNote").textContent = "灰色の「決定済」の席は、前回までに決まった席なので選べません。";
  }

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "message " + (type || "");
  }

  function render() {
    grid.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    grid.innerHTML = "";
    for (let r = 1; r <= rows; r++) {
      for (let c = 1; c <= cols; c++) {
        if (!SeatApp.isSeat(layout, r, c)) {
          const gap = document.createElement("div");
          gap.className = "seat aisle";
          grid.appendChild(gap);
          continue;
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seat";
        btn.title = SeatApp.seatLabel(layout, r, c);
        const pos = `<span class="pos">${SeatApp.seatShortLabel(layout, r, c)}</span>`;
        if (taken.has(SeatApp.key(r, c))) {
          btn.classList.add("taken");
          btn.disabled = true;
          btn.innerHTML = `<span class="rank">決定済</span>${pos}`;
        } else if (choice && choice.row === r && choice.col === c) {
          btn.classList.add("rank1");
          btn.innerHTML = `<span class="rank">希望</span>${pos}`;
        } else {
          btn.innerHTML = pos;
        }
        btn.addEventListener("click", () => {
          choice = { row: r, col: c };
          showMessage("");
          render();
        });
        grid.appendChild(btn);
      }
    }
    choiceEl.innerHTML = '<span class="badge r1">希望</span>' +
      (choice ? SeatApp.seatLabel(layout, choice.row, choice.col) : '<span class="muted">未選択</span>');
  }

  function buildData() {
    const number = parseInt(document.getElementById("number").value, 10);
    const name = document.getElementById("name").value.trim();
    if (!Number.isFinite(number) || number < 1) {
      showMessage("出席番号を入力してください。", "error");
      return null;
    }
    if (!name) {
      showMessage("名前を入力してください。", "error");
      return null;
    }
    if (!choice) {
      showMessage("希望の席を1つ選んでください。", "error");
      return null;
    }

    return {
      app: SeatApp.APP_ID,
      version: SeatApp.VERSION,
      round,
      number,
      name,
      rows,
      cols,
      off: [...layout.off],
      choice: { row: choice.row, col: choice.col },
      submittedAt: new Date().toISOString(),
    };
  }

  function download(data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    // 日本語のファイル名は環境によって無視されるため、回と出席番号だけにする
    a.download = `seat_r${round}_${String(data.number).padStart(2, "0")}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    showMessage(`「${a.download}」を保存しました。このファイルを先生に提出してください。`, "ok");
  }

  submitBtn.addEventListener("click", async () => {
    const data = buildData();
    if (!data) return;
    if (!api) {
      download(data);
      return;
    }
    submitBtn.disabled = true;
    downloadBtn.hidden = true;
    showMessage("送信中です…");
    try {
      await SeatApp.postToApi(api, data);
      showMessage(`提出しました（${SeatApp.seatLabel(layout, data.choice.row, data.choice.col)}）。`, "ok");
    } catch (e) {
      showMessage("送信できませんでした。少し待ってからもう一度押すか、下のボタンでファイルを保存して先生に渡してください。", "error");
      downloadBtn.hidden = false;
    } finally {
      submitBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener("click", () => {
    const data = buildData();
    if (data) download(data);
  });

  render();
})();
</script>
</body>
</html>
